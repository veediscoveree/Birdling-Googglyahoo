name: Species scan (eBird, last 60 days)

# Runs when the scan script changes (or manually), writes data/nearby-species.json.
on:
  push:
    branches: [claude/bird-game-prototype-Mx0aV]
    paths: ['scripts/species-scan.mjs', '.github/workflows/species-scan.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/species-scan.mjs
        env:
          EBIRD_KEY: ${{ secrets.VITE_EBIRD_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nearby-species.json
          git diff --staged --quiet || git commit -m "Species scan results [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} && git push
