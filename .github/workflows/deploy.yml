name: Build and Deploy

on:
  push:
    branches: [main, claude/bird-game-prototype-Mx0aV]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Optional API keys — set these as repository secrets to enable live
          # data in the deployed build. Absent = the app runs in mock/offline mode.
          VITE_XENOCANTO_KEY: ${{ secrets.VITE_XENOCANTO_KEY }}
          VITE_EBIRD_API_KEY: ${{ secrets.VITE_EBIRD_API_KEY }}

      - name: Update docs/index.html
        run: |
          cp dist/index.html docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Auto-rebuild docs/index.html [skip ci]"
          git push
