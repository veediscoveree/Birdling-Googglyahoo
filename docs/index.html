 of the lower bill"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#AEBAC5",female:"#AEBAC5"},uiColor:"#7E93A6",secondaryColors:{male:["#AEBAC5 (pale silver-gray back and wings)","#FFFFFF (body and tail)","#16171A (black wingtips)","#F1D04C (heavy yellow bill)","#D8352A (red bill spot)","#EDB0A8 (pink legs)"],female:["Same as male — the sexes look alike"]},distinctiveMarkings:{male:["Big and bulky with a flat-topped head","Long, heavy yellow bill with a RED SPOT near the tip of the lower bill (no black ring)","Pink legs","Pale silver-gray back, a shade darker than a Ring-billed Gull",'Black wingtips with large white tips and white "mirrors"',"Pale yellow eye with a yellow-orange eye-ring","Fall and winter: head and neck heavily smudged and streaked brown"],female:["Identical to male; females average smaller with slimmer bills"],juvenile:["Dusky brown all over with an all-dark bill and pink legs","Takes four years to reach adult plumage, getting grayer each year"]},plumageDescription:{male:"A big, powerful gull: white body and tail, pale silver-gray back and wings, and black wingtips with bold white spots. The long, heavy yellow bill has a bulge near the tip of the lower edge marked with a red spot. Legs are pink and the pale eye stares out from a yellow-orange ring. From fall through winter the head and neck are heavily streaked and smudged with brown; in spring and summer they are clean white.",female:"Identical to male in plumage; females are a little smaller with a less massive bill.",juvenile:"Young birds are dusky brown, checkered and mottled, with a blackish bill and pink legs — the big brown gulls on every beach. They take four years to become gray-and-white adults."}},primaryHabitat:["beaches","harbors","piers","jetties","bays","landfills","rooftops","reservoirs"],feedingLayer:"multi",flightStyle:"soaring",socialBehavior:{breeding:"colonial",winter:"large_flocks"},typicalGroupSize:{min:1,max:150},activeHours:"diurnal",sound:{callDescription:'Loud, ringing "heyah-heyah-ha-ha-ha-ha" long call — THE sound of the seashore. Also a deep "ga-ga-ga" alarm and a plaintive "mew".',songDescription:"No song. The long call starts with the head bowed, then the bird throws its head back and bugles with bill wide open.",loudness:9,callFrequency:7,singingSeason:{spring:"frequent",summer:"frequent",fall:"moderate",winter:"moderate"},sounds:["long call","ga-ga-ga","mew"]},seasons:{spring:{presence:"year_round",commonness:"common"},summer:{presence:"year_round",commonness:"common"},fall:{presence:"year_round",commonness:"very_common"},winter:{presence:"year_round",commonness:"very_common"}},range:"north_america_wide",regions:["NE","SE","NW","SW"],captureStats:{difficulty:3,speed:4,flightiness:4,camouflage:2,sizeScore:8,movementPattern:"soaring",captureBackground:"open_water",behaviorNotes:"Glides and wheels on long wings over harbors and beaches, riding the sea breeze with hardly a flap, then drops onto a jetty or piling. Big and slow-moving — but on a windy day it can slide out of view fast. Check for pink legs and a red bill spot."},rarity:"common",rarityColor:"#4caf50",points:100,verificationThreshold:.66,verificationMethods:1,description:'The American Herring Gull is the big gull most people mean when they say "seagull" — loud, bold, and clever, patrolling NYC beaches, piers, and harbors all year. Adults are white and silver-gray with black wingtips, pink legs, and a hefty yellow bill with a red spot. Young ones are brown and take four years to grow up, so a beach flock is a puzzle of ages. Compared with a Ring-billed Gull it is bigger and fiercer-looking, with pink (not yellow) legs and a red spot instead of a black ring. Until 2025 it was lumped with the Herring Gulls of Europe as one species.',funFacts:["Herring Gulls crack clams and mussels by flying up high and dropping them onto rocks, jetties, or parking lots — then swooping down to eat the insides.","The red spot on the bill is a dinner bell: chicks peck at it to make their parent cough up food. A scientist named Niko Tinbergen studied this and later won a Nobel Prize.","Gulls can drink seawater! Special salt glands above their eyes pull extra salt out of their blood, and it drips out of their nostrils."],eBirdCode:"amhgul1",merlinId:"Herring_Gull"},vm=Object.freeze(Object.defineProperty({__proto__:null,default:Cm},Symbol.toStringTag,{value:"Module"})),Am={id:"chipping_sparrow",commonName:"Chipping Sparrow",scientificName:"Spizella passerina",family:"Passerellidae",order:"Passeriformes",sizeCategory:"tiny",length_cm:[12,15],wingspan_cm:[20,22],weight_g:[11,16],appearance:{billShape:"conical",billSizeRelative:"small",billColor:{male:"black (breeding); pinkish with dark tip (nonbreeding)",female:"black (breeding); pinkish with dark tip (nonbreeding)"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#8C6640",female:"#8C6640"},uiColor:"#B2451C",secondaryColors:{male:["#B2451C (bright rufous cap)","#F7F4EC (white eyebrow)","#1C1714 (black eye-line)","#C8CBC6 (plain gray breast and face)"],female:["Same as male"]},distinctiveMarkings:{male:["Bright rufous cap (solid, unstreaked)","Crisp white eyebrow under the cap","Black eye-line running from the bill through the eye","Plain, unstreaked pale-gray face and breast","Small, slim sparrow with a fairly long, notched tail","Two thin white wing bars; gray rump"],female:["Identical to male"],juvenile:["Streaked breast and crown (summer only) — molts out by early fall"],nonbreeding:["Fall/winter: cap duller brown with fine streaks","Eyebrow buffy rather than white","Bill pale pinkish","Breast washed buff-gray","Dark line still runs THROUGH the eye to the bill — separates it from the similar Clay-colored Sparrow"]},plumageDescription:{male:"A small, tidy sparrow. In spring and summer the adult wears a bright rufous cap, a crisp white eyebrow, and a black line through the eye that reaches all the way to the bill. The face, collar, and breast are a plain, clean gray with no streaks. The back is brown streaked with black, and the wings show two thin white bars.",female:"Identical to male.",juvenile:"Brown and finely streaked, including the breast and crown — briefly looks like a different species in summer.",nonbreeding:"Many Chipping Sparrows seen in Sep–Nov are in duller nonbreeding or first-fall plumage: the cap is brown with fine streaks and only a hint of rufous, the eyebrow is buffy, the bill is pale pink, and the breast has a buffy wash. Look for the dark eye-line that still goes through the lores to the bill, the gray rump, and the plain, unstreaked breast."}},primaryHabitat:["parks","suburban_lawns","open_woodland","woodland_edge","pine_groves","gardens"],feedingLayer:"ground",flightStyle:"bounding",socialBehavior:{breeding:"territorial_pairs",winter:"flocks"},typicalGroupSize:{min:1,max:25},activeHours:"diurnal",sound:{callDescription:'A sharp, high "tsip" or "chip"; a thin "tseet" in flight.',songDescription:`A long, dry, even trill of identical chips — "chip-chip-chip-chip-chip" — so mechanical it sounds like a sewing machine or a sprinkler. Faster and drier than a Dark-eyed Junco's trill.`,loudness:5,callFrequency:7,singingSeason:{spring:"frequent",summer:"frequent",fall:"rare",winter:"silent"}},seasons:{spring:{presence:"summer",commonness:"common"},summer:{presence:"summer",commonness:"common"},fall:{presence:"migrant",commonness:"common"},winter:{presence:"winter",commonness:"rare"}},range:"north_america",regions:["NE","SE","NW","SW"],captureStats:{difficulty:3,speed:4,flightiness:4,camouflage:3,sizeScore:1,movementPattern:"hopping",flightPattern:"bounding",captureBackground:"forest_edge",behaviorNotes:"Hops on short grass and bare ground under trees, picking up small seeds, then flicks up to a low branch when startled. In fall, travels in loose flocks — often mixed with juncos and other sparrows. Look for the rufous cap and the black line through the eye."},rarity:"common",rarityColor:"#4caf50",points:90,verificationThreshold:.62,verificationMethods:1,description:"The Chipping Sparrow is the neat little sparrow of lawns, parks, and pine groves — a small gray-breasted bird with a rufous cap that looks like it is wearing a tiny red beret. Its song is a dry, rattling trill that rings from treetops all summer. In fall it gathers in flocks on short grass and weedy edges, and many birds trade the bright cap for a duller, streaky brown one, so watch for the dark line through the eye and the plain gray breast.",funFacts:["Chipping Sparrows line their tiny nests with animal hair — long ago mostly horsehair, today often hair from dogs, deer, or even people.","A Chipping Sparrow's song is a fast, even trill that can last two or three seconds and is so mechanical that people mistake it for an insect or a sewing machine.","Young Chipping Sparrows have streaky breasts for their first summer, which fools a lot of beginning birders — by fall they switch to a plain breast like their parents."],eBirdCode:"chispa",merlinId:"Chipping_Sparrow"},Mm=Object.freeze(Object.defineProperty({__proto__:null,default:Am},Symbol.toStringTag,{value:"Module"})),Lm={id:"laughing_gull",commonName:"Laughing Gull",scientificName:"Leucophaeus atricilla",family:"Laridae",order:"Charadriiformes",sizeCategory:"medium",length_cm:[39,46],wingspan_cm:[98,110],weight_g:[200,370],appearance:{billShape:"hooked",billSizeRelative:"medium",billColor:{male:"dark red in summer; blackish in fall and winter",female:"dark red in summer; blackish in fall and winter"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#59626C",female:"#59626C"},uiColor:"#4A535D",secondaryColors:{male:["#59626C (dark slate-gray back and wings)","#FFFFFF (body, tail, wing trailing edge)","#141416 (black wingtips)","#2B2427 (dark bill and legs)","#1A1A1A (summer black hood)"],female:["Same as male — the sexes look alike"]},distinctiveMarkings:{male:["Dark slate-gray back and wings — much darker than Ring-billed or Herring Gulls","Black wingtips that blend into the gray, with tiny white tips and no big white mirrors","Broad white trailing edge on the wing in flight","Long, slightly drooping dark bill","Dark legs","Dark eye with white crescents above and below",'Summer: black hood. Fall and winter: white head with a smudgy gray "half-hood" behind the eye',"Slim, with long wings reaching well past the tail"],female:["Identical to male"],juvenile:["Brown above with pale scaly edges, gray-brown breast, white rump and a black tail band","Molts into gray-backed first-winter plumage during its first fall"]},plumageDescription:{male:"A slim, long-winged gull with a dark slate-gray back and black wingtips that melt into the gray. In summer the head is jet black with white eye crescents and the bill dark red. By September the hood is fading, and in fall the head is white with a gray smudge behind the eye like a half-hood, the bill and legs blackish.",female:"Identical to male in plumage.",juvenile:"Juveniles are brown and scaly above with a gray-brown chest, white rump, and black tail band; they turn gray-backed through their first fall."}},primaryHabitat:["beaches","bays","salt_marshes","harbors","piers","parking_lots","ball_fields"],feedingLayer:"water_surface",flightStyle:"gliding",socialBehavior:{breeding:"colonial",winter:"large_flocks"},typicalGroupSize:{min:1,max:300},activeHours:"diurnal",sound:{callDescription:'A high, nasal laugh: "ha-ha-ha-haah-haah-haah" — the long call that gives the bird its name. Also a single, sharp "kee-ow".',songDescription:"No song. The laughing long call is given with the head thrown back, often by many birds at once around a colony.",loudness:8,callFrequency:8,singingSeason:{spring:"frequent",summer:"frequent",fall:"occasional",winter:"silent"},sounds:["ha-ha-ha laugh","kee-ow"]},seasons:{spring:{presence:"migrant_and_breeder",commonness:"common"},summer:{presence:"breeder",commonness:"abundant"},fall:{presence:"migrant",commonness:"common"},winter:{presence:"rare",commonness:"rare"}},range:"atlantic_flyway",regions:["NE","SE"],captureStats:{difficulty:4,speed:6,flightiness:5,camouflage:3,sizeScore:6,movementPattern:"aerial_dart",captureBackground:"open_water",behaviorNotes:"Buoyant and acrobatic: swoops low over the waves to pluck food off the surface and twists through the air chasing flying ants on warm fall days. Faster and more agile than the big gulls — wait for it to hang in the wind. Look for the dark back and white trailing edge."},rarity:"common",rarityColor:"#4caf50",points:110,verificationThreshold:.66,verificationMethods:1,description:'The Laughing Gull is the dark-backed gull of New York and New Jersey summers, named for its loud "ha-ha-ha" call. Huge numbers nest in the salt marshes of Jamaica Bay and the Jersey shore, then linger into fall before heading south — most are gone by December. By fall the black summer hood has worn off, leaving a white head with a gray smudge behind the eye. Among other gulls, look for the much darker gray back, black wingtips with no big white spots, dark bill and legs, and slim, long-winged shape.',funFacts:["Laughing Gulls are cheeky food thieves — in the South they sometimes stand right on a Brown Pelican's head and grab fish spilling from its pouch!","Each spring, Laughing Gulls gather by the tens of thousands on Delaware Bay beaches in New Jersey to feast on the tiny green eggs of horseshoe crabs.",'In summer a Laughing Gull wears a black hood and a dark red bill. By fall the hood fades away — it is the same bird, just in its "winter clothes".'],eBirdCode:"laugul",merlinId:"Laughing_Gull"},Sm=Object.freeze(Object.defineProperty({__proto__:null,default:Lm},Symbol.toStringTag,{value:"Module"})),_m={id:"ring_billed_gull",commonName:"Ring-billed Gull",scientificName:"Larus delawarensis",family:"Laridae",order:"Charadriiformes",sizeCategory:"medium",length_cm:[43,54],wingspan_cm:[112,127],weight_g:[300,700],appearance:{billShape:"hooked",billSizeRelative:"medium",billColor:{male:"yellow with a complete black ring near the tip",female:"yellow with a complete black ring near the tip"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#B9C5CF",female:"#B9C5CF"},uiColor:"#8FA3B5",secondaryColors:{male:["#B9C5CF (pale silver-gray back and wings)","#FFFFFF (head, body, tail)","#16171A (black wingtips)","#EECB43 (yellow bill and legs)","#D23A2E (red eye-ring)"],female:["Same as male — the sexes look alike"]},distinctiveMarkings:{male:["Yellow bill with a complete black RING near the tip — the namesake mark","Yellow legs (Herring Gull has pink legs, Laughing Gull dark legs)","Pale silver-gray back, a shade paler than a Herring Gull",'Black wingtips with white spots; white "mirrors" show in flight',"Pale yellow eye with a thin red eye-ring","Fall and winter: white head finely freckled with brown on the nape","Medium size with a rounded head and a fairly short, slim bill"],female:["Identical to male"],juvenile:["Mottled brown-and-gray first winter, with a pink bill tipped black and pink legs","Takes three years to reach adult plumage — first-winter birds already show a gray back"]},plumageDescription:{male:"A clean, medium-sized gull: snow-white head, body, and tail with a pale silver-gray back and wings and black wingtips spotted white. The yellow bill is crossed by a crisp black ring near the tip, the legs are yellow, and the pale eye has a thin red ring. From September through winter the head is freckled with fine brown spots, heaviest on the nape; by spring it is pure white again.",female:"Identical to male in plumage; females average slightly smaller.",juvenile:"First-fall birds are a checkerboard of brown and gray with a pink bill tipped black and pink legs. Over three years they turn grayer and whiter, gaining the yellow bill ring and yellow legs of the adult."}},primaryHabitat:["parking_lots","parks","ball_fields","beaches","reservoirs","harbors","landfills","farm_fields"],feedingLayer:"ground",flightStyle:"direct",socialBehavior:{breeding:"colonial",winter:"large_flocks"},typicalGroupSize:{min:1,max:300},activeHours:"diurnal",sound:{callDescription:'A high, squealing "kee-yah" and laughing "kyow-kyow-kyow" — higher and thinner than a Herring Gull. Flocks keep up a mewing, squabbling chatter.',songDescription:'No song. The "long call" is a series of shrill, laughing notes given with the head thrown back.',loudness:7,callFrequency:8,singingSeason:{spring:"frequent",summer:"moderate",fall:"frequent",winter:"frequent"},sounds:["kee-yah","kyow","mew"]},seasons:{spring:{presence:"migrant",commonness:"common"},summer:{presence:"summer",commonness:"uncommon"},fall:{presence:"migrant",commonness:"abundant"},winter:{presence:"winter",commonness:"abundant"}},range:"north_america_wide",regions:["NE","SE","NW","SW"],captureStats:{difficulty:2,speed:3,flightiness:3,camouflage:2,sizeScore:7,movementPattern:"walking",captureBackground:"urban_edge",behaviorNotes:"Walks confidently across parking lots, lawns, and ball fields, pausing to stare at anything that might be food. Bold around people — often the easiest gull to get close to. Check the bill for the black ring and the legs for yellow."},rarity:"common",rarityColor:"#4caf50",points:90,verificationThreshold:.66,verificationMethods:1,description:"The Ring-billed Gull is the gull of shopping-center parking lots, school fields, and city parks — the one waiting for your dropped french fry. It is medium-sized and tidy, with a pale gray back, yellow legs, and a yellow bill wrapped in a neat black ring. Around NYC they pour in from inland nesting colonies from late summer on and stay all winter. Next to a Herring Gull, look for the smaller size, rounder head, slimmer bill with a ring (not a red spot), and yellow (not pink) legs.",funFacts:["Around 1900, hunting and egg collecting made Ring-billed Gulls scarce on the Great Lakes. Once they were protected they bounced back so well that there are now millions of them.","It takes a Ring-billed Gull three years to grow its grown-up gray-and-white feathers. Until then, young birds wear scruffy brown patterns that change every year.","Ring-billed Gulls follow farmers' plows to snap up the worms and grubs turned up in the soil — and they have learned that fast-food restaurants are just as good."],eBirdCode:"ribgul",merlinId:"Ring-billed_Gull"},Fm=Object.freeze(Object.defineProperty({__proto__:null,default:_m},Symbol.toStringTag,{value:"Module"})),Em={id:"savannah_sparrow",commonName:"Savannah Sparrow",scientificName:"Passerculus sandwichensis",family:"Passerellidae",order:"Passeriformes",sizeCategory:"small",length_cm:[11,15],wingspan_cm:[20,22],weight_g:[15,29],appearance:{billShape:"conical",billSizeRelative:"small",billColor:{male:"pinkish with darker upper ridge",female:"pinkish with darker upper ridge"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#8A6A48",female:"#8A6A48"},uiColor:"#D4B23A",secondaryColors:{male:["#F2CF3A (yellow eyebrow in front of the eye)","#FBFAF5 (white underparts)","#4A3424 (fine dark streaks)","#E9E0C8 (pale crown stripe)"],female:["Same as male"]},distinctiveMarkings:{male:["Yellow eyebrow in front of the eye (can be pale in some birds)","Pale central crown stripe","Fine, crisp dark streaks on white breast and flanks, often with a small central spot","Dark whisker (malar) stripe","Short, notched tail","Pink legs and pinkish bill"],female:["Identical to male"],juvenile:["Buffier, with even finer streaks and little or no yellow"],nonbreeding:["Fall birds look fresh and crisp; the yellow eyebrow can be duller on young birds",'Pale "Ipswich" birds (subspecies princeps) winter on Atlantic coastal dunes, including NYC/NJ beaches']},plumageDescription:{male:"A neat, streaky sparrow of open grassland. The white breast and flanks are covered in fine, sharp brown streaks, often gathering into a small central spot. A pale stripe runs down the center of the brown crown, and the eyebrow is yellow in front of the eye. lashes a dab of yellow over the eye, then drops back into the grass. In fall, migrants pour into grassy parks, airfields, and beach dunes around New York City. Its finely streaked breast, yellow eyebrow, and short notched tail separate it from the bigger, long-tailed Song Sparrow.",funFacts:["It was named after Savannah, Georgia, where the famous early bird artist Alexander Wilson collected one — not because it lives in African savannas!","Savannah Sparrows migrate at night and use the stars, the sunset sky, and Earth's magnetic field to find their way — scientists have tested this with young birds in planetariums.",'A pale, sand-colored kind called the "Ipswich Sparrow" nests only on Sable Island, far out in the Atlantic off Nova Scotia, and spends the winter hiding in beach dunes, including near NYC.'],eBirdCode:"savspa",merlinId:"Savannah_Sparrow"},Wm=Object.freeze(Object.defineProperty({__proto__:null,default:Em},Symbol.toStringTag,{value:"Module"})),Bm={id:"swamp_sparrow",commonName:"Swamp Sparrow",scientificName:"Melospiza georgiana",family:"Passerellidae",order:"Passeriformes",sizeCategory:"small",length_cm:[12,15],wingspan_cm:[18,19],weight_g:[14,22],appearance:{billShape:"conical",billSizeRelative:"small",billColor:{male:"dark gray above, paler below",female:"dark gray above, paler below"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#7A5434",female:"#7A5434"},uiColor:"#B04A1C",secondaryColors:{male:["#B04A1C (bright rusty wings)","#93401C (rusty cap)","#A2A6A5 (gray face and eyebrow)","#F4F3EE (white throat)","#8F9593 (dusky gray breast)"],female:["Same as male; cap often a little streakier"]},distinctiveMarkings:{male:["Bright rusty wings with no bold wing bars","Rusty cap (finely streaked)","Gray face and gray eyebrow","Dark line behind the eye and a thin dark whisker","Clean white throat","Dusky gray, essentially unstreaked breast","Buffy-brown flanks"],female:["Very similar to male"],juvenile:["Darker and streakier overall, wi mentPattern:"skulking",flightPattern:"fluttering",captureBackground:"marsh_edge",behaviorNotes:'Creeps low among cattails, reeds, and wet weedy edges, popping up for a moment to look around or answer a "pish," then dropping back into cover. Often heard giving its hard "chip" before it is seen. Flies low and short, pumping its tail.'},rarity:"common",rarityColor:"#4caf50",points:130,verificationThreshold:.65,verificationMethods:1,description:'The Swamp Sparrow is the sparrow that likes wet feet. It lives in cattail marshes and soggy thickets, where its rusty wings, gray face, and white throat glow against the brown reeds. It is shy and spends most of its time low in the vegetation, but in fall, marsh edges in New York and New Jersey can hold dozens of them — listen for the hard "chip" and watch for a dark, rusty-winged sparrow popping up from the cattails.',funFacts:["Swamp Sparrows wade into shallow water to hunt — they can even dunk their whole head under the surface to grab a water insect!","Scientists have studied Swamp Sparrow songs for decades to learn how young birds learn to sing — much like how kids learn to talk by listening to grown-ups.","Their song is a simple, sweet trill, but a male can sing a few different versions and switch between them."],eBirdCode:"swaspa",merlinId:"Swamp_Sparrow"},$m=Object.freeze(Object.defineProperty({__proto__:null,default:Bm},Symbol.toStringTag,{value:"Module"})),Tm=[{id:"northern_cardinal",commonName:"Northern Cardinal",scientificName:"Cardinalis cardinalis",family:"Cardinalidae",order:"Passeriformes",sizeCategory:"small",length_cm:[21,23],wingspan_cm:[25,31],weight_g:[42,48],appearance:{billShape:"conical",billSizeRelative:"large",billColor:{male:"orange-red",female:"orange-red"},crestPresent:!0,crestColor:{male:"red",female:"brownish-red"},primaryColor:{male:"#CC2233",female:"#A87050"},uiColor:"#CC2233",secondaryColors:{male:["#1A1A1A (face mask)","#E06020 (bill)"],female:["#CC2233 (crest, wings, tail)","#E06020 (bill)"]}, ange breast. A white belly patches below; broken white eye ring and white throat streaks frame a yellow bill. Classic thrush shape — round body, short tail, strong legs.",female:"Similar but with a brownish-gray (not black) head and a slightly paler, peachier breast. Often told apart only by direct comparison.",juvenile:"The spotted juvenile robins of late spring/summer reveal the robin's thrush ancestry — orange breast covered in dark spots, back sprinkled with pale dots."}},primaryHabitat:["lawns","parks","open_woodland","gardens","suburban"],feedingLayer:"ground",flightStyle:"direct",socialBehavior:{breeding:"territorial_pairs",winter:"large_roosts"},typicalGroupSize:{min:1,max:200},activeHours:"diurnal",sound:{callDescription:'"Tut-tut-tut" alarm call; high thin "seee" for aerial predators',songDescription:'Cheerful caroling phrases: "cheerily, cheer up, cheer up, cheerily, cheer up". Arguably the most familiar bird song in North America. Begins singing before dawn.',loudness:7,callFrequency:8,singingSeason:{spring:"frequent",summer:"frequent",fall:"occasional",winter:"rare"},sounds:["tut","song","seee"]},seasons:{spring:{presence:"summer",commonness:"abundant"},summer:{presence:"summer",commonness:"abundant"},fall:{presence:"migrant",commonness:"common"},winter:{presence:"winter",commonness:"uncommon"}},range:"north_america",captureStats:{difficulty:2,speed:4,flightiness:3,camouflage:3,sizeScore:6,movementPattern:"hopping",flightPattern:"direct",behaviorNotes:"Runs across lawns in short bursts, stopping to cock its head and listen/watch for earthworms. Quite bold near humans. Flushes readily if approached quickly but returns soon."},rarity:"common",rarityColor:"#4caf50",points:80,verificationThreshold:.66,verificationMethods:1,description:"The herald of spring across North America. Robins are among the first birds to sing before dawn and among the last to fall silent at dusk. Their earthworm-hunting technique — running, stopping, tilting the head — is one of the most familiar sights in any suburban yard. Despite their familiarity, robins in winter congregate in massive roosts that can number in the thousands.",funFacts:["A robin doesn't actually hear earthworms through the ground — it sees them. That sideways head-tilt is tilting one eye toward the soil to get a better look.","American Robins can raise up to three broods in a single breeding season — the female starts building a new nest while the male still feeds the first brood."],eBirdCode:"amerob",merlinId:"American_Robin"},{id:"blue_jay",commonName:"Blue Jay",scientificName:"Cyanocitta cristata",family:"Corvidae",order:"Passeriformes",sizeCategory:"small",length_cm:[22,30],wingspan_cm:[34,43],weight_g:[70,100],appearance:{billShape:"thin",billSizeRelative:"medium",billColor:{male:"black",female:"black"},crestPresent:!0,crestColor:{male:"blue",female:"blue"},primaryColor:{male:"#4A7FBD",female:"#4A7FBD"},uiColor:"#4A7FBD",secondaryColors:{male:["#FAFAFA (face, belly)","#1A1A1A (necklace, wing bars)","#4A7FBD (crest, wings, tail)"],female:["Same as male — sexes look alike"]},distinctiveMarkings:{male:["Bright blue crest, wings, and tail","White face and underparts","Bold black necklace across throat/chest","White wing bars and tail corners","Black barring on wings and tail"],female:["Identical to male in appearance"],juvenile:["Duller blue than adults; crest shorter; gains adult plumage by first winter"]},plumageDescription:{male:'Unmistakable in flight and at rest. A blue corvid with a pointed crest, white face, and bold black "necklace" connecting the crest, eye, and collar. Blue wings show white wing bars and dark barring. The tail is long, blue, and prominently barred. Underparts white.',female:"Identical to male — one of the few songbirds where field separation of sexes is practically impossible without genetic testing.",juvenile:"Slightly duller blue tones in the first year, with a shorter crest. Nearly identical to adults by autumn."}},primaryHabitat:["deciduous winter before spring fully arrives.',loudness:6,callFrequency:9,singingSeason:{spring:"frequent",summer:"moderate",fall:"frequent",winter:"frequent"},sounds:["chick-a-dee","fee-bee","gargle"]},seasons:{spring:{presence:"resident",commonness:"common"},summer:{presence:"resident",commonness:"common"},fall:{presence:"resident",commonness:"common"},winter:{presence:"resident",commonness:"common"}},range:"northern_north_america",captureStats:{difficulty:5,speed:7,flightiness:3,camouflage:4,sizeScore:2,movementPattern:"darting",flightPattern:"undulating",behaviorNotes:"Tiny and hyperactive — never still for more than a few seconds. Hangs upside-down from branch tips to reach insects. Paradoxically bold around humans; will sometimes land on an outstretched hand at feeders. The challenge is their size and constant motion."},rarity:"common",rarityColor:"#4caf50",points:120,verificationThreshold:.66,verificationMethods:1,description:`Possibly the most cheerful bird in North America. Chickadees stay through the harshest winters, traveling in small flocks through frozen forests, finding insects in bark crevices that no other bird can reach. They have a sophisticated social system and can lower their body temperature at night to conserve energy — a feat called "regulated hypothermia." Their alarm calls carry so much information about a predator's size, speed, and danger level that other species have learned to listen.`,funFacts:["Every autumn, a chickadee's hippocampus (the memory center of the brain) actually grows larger to handle thousands of new food cache locations. It shrinks again in spring.","Chickadees on the edge of a sleeping flock keep one eye open, watching for predators — a form of sentinel behavior that keeps the whole group safer."],eBirdCode:"bkcchi",merlinId:"Black-capped_Chickadee"},{id:"american_goldfinch",commonName:"American Goldfinch",scientificName:"Spinus tristis",family:"Fringillidae",order:"Passeriformes",sizeCategory:"tiny",length_cm:[11,14],wingspan_cm:[19,22],weight_g:[11,20],appearance:{billShape:"conical",billSizeRelative:"small",billColor:{male:"pink-orange",female:"dull-pink"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#FFD700",female:"#B8A840"},uiColor:"#FFD700",secondaryColors:{male:["#1A1A1A (forehead cap, wings, tail)","#FAFAFA (wing bars, rump)","#F0A040 (bill)"],female:["#B8A840 (olive-yellow body)","#1A1A1A (wings)","#FAFAFA (wing bars)"]},distinctiveMarkings:{male:["Brilliant lemon-yellow body (breeding)","Black forehead cap","Black wings with white wing bars","White rump","Stubby pink-orange bill","Winter: olive-yellow, no black cap"],female:["Dull olive-yellow; no black cap","White wing bars on black-ish wings","Paler below than above","Year-round plumage similar to male winter"],juvenile:["Similar to female; buffy wing bars instead of white"]},plumageDescription:{male:"Summer male is electric: pure lemon-yellow with a small black cap on the forehead, jet-black wings with white wing bars, white rump. Winter male molts to olive-yellow, loses the black cap, and becomes almost unrecognizable until spring.",female:"Olive-yellow throughout the year — brighter in summer, duller in winter. Black wings with white bars. Often overlooked despite being present at most nyjer seed feeders.",juvenile:"Resembles female; buffy rather than white wing bars. Acquires adult plumage in first autumn."}},primaryHabitat:["fields","meadows","weedy_areas","feeders","open_woodland"],feedingLayer:"shrub",flightStyle:"undulating",socialBehavior:{breeding:"loose_colonies",winter:"flocks"},typicalGroupSize:{min:2,max:40},activeHours:"diurnal",sound:{callDescription:'"Per-chick-o-ree" or "po-ta-to-chip" call given in flight — this bouncy phrase perfectly matches the undulating flight pattern.',songDescription:"Long, canary-like warble of rapid twitters, trills, and chips. Energetic and sustained.",loudness:5,callFrequency:8,singingSeason:{spring:"moderate",summer:"frequent",fall:"occasional",winter:"rare"},sounds:["per-chick-o-ree","song-warble","contact-call"]},seasons:{spring:{presence:"resident",commonness:"common"},summer:{presence:"summer",commonness:"common"},fall:{presence:"migrant",commonness:"common"},winter:{presence:"winter",commonness:"uncommon"}},range:"north_america",captureStats:{difficulty:5,speed:6,flightiness:5,camouflage:2,sizeScore:2,movementPattern:"darting",flightPattern:"undulating",behaviorNotes:"Feeds acrobatically on seed heads — hanging sideways, upside-down. In flocks, individuals are scattered and constantly moving. The undulating flight — rise on wingbeats, dip on wing-fold — makes tracking in binoculars tricky."},rarity:"common",rarityColor:"#4caf50",points:115,verificationThreshold:.66,verificationMethods:1,description:"New Jersey's state bird and a frequent visitor to nyjer seed feeders. The male in breeding plumage is one of the most vivid birds in North America — a flying lemon with a black beret. Goldfinches are unusual songbirds in that they wait until July or August to nest, timing their breeding to peak thistle-seed abundance. They weave spider silk into their nests, which stretches as the nestlings grow.",funFacts:["Goldfinch nests are so tightly woven they can hold water. If it rains during an early cold snap, the young have been known to drown — one reason late breeding evolved.","American Goldfinches are one of the strictest vegetarians in North America — they feed almost exclusively on seeds and will pick individual insects off seeds if one gets in the way."],eBirdCode:"amegfi",merlinId:"American_Goldfinch"},{id:"mallard",commonName:"Mallard",scientificName:"Anas platyrhynchos",family:"Anatidae",order:"Anseriformes",sizeCategory:"large",length_cm:[50,65],wingspan_cm:[81,98],weight_g:[720,1600],appearance:{billShape:"spatulate",billSizeRelative:"large",billColor:{male:"yellow-orange",female:"orange-black mottled"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#2D6B4A",female:"#8B6914"},uiColor:"#2D6B4A",secondaryColors:{male:["#2D6B4A (iridescent green head)","#FAFAFA (neck ring)","#8B3A2A (chestnut breast)","#C8C8C8 (gray flanks)","#1A1A1A (black stern)","#E8B830 (bill)"],female:["#8B6914 (mottled brown overall)","#FF8C00 (orange sides of bill)","#5B7F9E (speculum)","#FAFAFA (tail)"]},distinctiveMarkings:{male:["Iridescent green head","Thin white neck ring","Chestnut-brown breast","Gray body","Black rear end with curled tail feathers","Yellow-orange bill","Blue-purple speculum (wing patch)"],female:["Mottled brown streaky overall","Orange bill with black splotches","Dark eye stripe","Blue-purple speculum with white borders","Pale orange legs"],juvenile:["Resembles female; gains adult plumage through first winter"]},plumageDescription:{male:'Breeding male is a gallery piece: iridescent bottle-green head (that changes color angle to angle), separated by a crisp white neck ring from a chestnut breast. Gray flanks, black rump, and a distinctive curled black tail feather ("sex feather"). Bill bright yellow-orange.',female:"Mottled brown — perfectly camouflaged for nesting. Her orange bill shows black blotching. The blue-purple speculum (wing patch) flashes in flight on both sexes.",juvenile:"Resembles female initially. Males begin showing green head by November of their first year."}},primaryHabitat:["ponds","lakes","rivers","wetlands","parks","urban_water"],feedingLayer:"water",flightStyle:"direct",socialBehavior:{breeding:"pairs",winter:"large_flocks"},typicalGroupSize:{min:2,max:100},activeHours:"diurnal",sound:{callDescription:'Iconic "quack" — actually a female call. Males make a softer, nasal "raeb-raeb". Both sexes grunt, whistle, and murmur.',songDescription:`Not a songbird; uses calls for communication. The female's loud descending "quack-quack-quack" is the "duck sound" of cultural memory.`,loudness:7,callFrequency:6,singingSeason:{spring:"frequent",summer:"moderate",fall:"moderate",winter:"moderate"},sounds:["quack","raeb","grunt","whistle"]},seasons:{spring:{presence:"resident",commonness:"abundant"},summer:{presence:"resident",commonness:"common"},fall:{presence:"resident",commonness:"abundant"},winter:{presence:"resident",commonness:"common"}},range:"northern_hemisphere",captureStats:{difficulty:2,speed:2,flightiness:3,camouflage:4,sizeScore:8,movementPattern:"swimming",flightPattern:"direct",behaviorNotes:"Swims slowly on open water; dabbles with head submerged for aquatic vegetation. Accustomed to humans in urban parks — often approaches rather than flees. Large size makes centering easy; slow movement means patience is the only skill required."},rarity:"common",rarityColor:"#4caf50",points:90,verificationThreshold:.66,verificationMethods:1,description:"The world's most familiar duck and the ancestor of almost every domestic duck breed. Mallards are found on every continent except Antarctica and have adapted perfectly to city parks, drainage ditches, and golf course ponds. Watch for the courtship displays in winter — groups of males circle females with elaborate head-pumping, wing-flap, and whistle sequences that look choreographed.",funFacts:['Mallards can sleep with one eye open and half their brain awake — a phenomenon called unihemispheric slow-wave sleep. Ducks at the edge of a flock keep the "outer eye" open, watching for predators.',"A Mallard hen will feign a broken wing to lead predators away from her ducklings — one of the most effective distraction displays in the bird world."],eBirdCode:"mallar3",merlinId:"Mallard"},{id:"red_tailed_hawk",commonName:"Red-tailed Hawk",scientificName:"Buteo jamaicensis",family:"Accipitridae",order:"Accipitriformes",sizeCategory:"large",length_cm:[45,65],wingspan_cm:[110,145],weight_g:[690,1460],appearance:{billShape:"hooked",billSizeRelative:"large",billColor:{male:"gray-yellow",female:"gray-yellow"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#8B6030",female:"#8B6030"},uiColor:"#C85020",secondaryColors:{male:["#C85020 (rufous-red tail e:"resident",commonness:"common"}},range:"north_america",captureStats:{difficulty:6,speed:4,flightiness:7,camouflage:5,sizeScore:9,movementPattern:"soaring",flightPattern:"soaring",behaviorNotes:"Often spotted on telephone poles or dead trees scanning for prey. In binoculars view, moves in slow thermal circles — easy to track but very alert. Will peel away from soar suddenly if disturbed. High in sky = small apparent target despite large wingspan."},rarity:"uncommon",rarityColor:"#2196f3",points:250,verificationThreshold:.85,verificationMethods:2,description:"The most common large hawk in North America — and the one you've probably heard in every action movie, even when the scene shows a Bald Eagle. Look for them perched on highway poles, soaring over open fields, or circling on thermals over suburban neighborhoods. Pairs return to the same territory year after year, adding sticks to an ever-growing nest that can eventually weigh hundreds of pounds.",funFacts:["Red-tailed Hawks can see ultraviolet light, which makes rodent urine trails glow — a built-in tracking system that leads them directly to vole runways.",`The iconic "eagle scream" used in nearly every movie and TV show featuring a bald eagle is actually the Red-tailed Hawk's call — bald eagles make a far less impressive chittering sound.`],eBirdCode:"rethaw",merlinId:"Red-tailed_Hawk"},{id:"great_blue_heron",commonName:"Great Blue Heron",scientificName:"Ardea herodias",family:"Ardeidae",order:"Pelecaniformes",sizeCategory:"very_large",length_cm:[91,137],wingspan_cm:[167,201],weight_g:[1820,3630],appearance:{billShape:"spear",billSizeRelative:"massive",billColor:{male:"yellow-orange",female:"yellow-orange"},crestPresent:!0,crestColor:{male:"black-white",female:"black-white"},primaryColor:{male:"#6080A0",female:"#6080A0"},uiColor:"#6080A0",secondaryColors:{male:["#6080A0 (blue-gray body)","#FAFAFA (white head)","#1A1A1A (black eyestripe)","#C8A060 (rusty thighs)","#F5E6C8 (plumes)"],female:["Identical to male"]},distinctiveMarkings:{male:["White head with black eyestripe extending to black plume","Blue-gray body","Chestnut-rusty thighs","Long yellow-orange dagger bill","Long black plumes on back and breast","S-curved neck in flight (diagnostic for herons vs. cranes)","Stands 4 feet tall"],female:["Identical to male in plumage"],juvenile:["All gray-brown head (no white or plumes)","Dark cap solid black","Streaked neck","Duller overall"]},plumageDescription:{male:"Prehistoric in scale — North America's largest heron. Blue-gray plumage, white face with a black stripe running from behind the eye to trailing black plumes, and a massive yellow-orange spear bill. The neck is folded into a tight S-curve at rest and in flight (a field mark separating herons from cranes, which fly with necks extended).",female:"Identical to male. Females may average slightly smaller but are not reliably distinguished in the field.",juvenile:"Lacks the white head and ornamental plumes of adults. Dark-capped, brownish, and streaked. Earns adult plumage over two years."}},primaryHabitat:["marshes","lakeshores","rivers","tidal_flats","ponds","flooded_fields"],feedingLayer:"water",flightStyle:"soaring",socialBehavior:{breeding:"colonial_nesting",winter:"solitary"},typicalGroupSize:{min:1,max:3},activeHours:"diurnal",sound:{callDescription:'Harsh, prehistoric "FRAAAAHNK" — a loud, grating croak, especially when flushed from a feeding spot. Sounds like a pterodactyl.',songDescription:"No true song. Nesting colonies produce a cacophony of bill-clacking, croaking, and grunting.",loudness:8,callFrequency:2,singingSeason:{spring:"occasional",summer:"occasional",fall:"occasional",winter:"rare"},sounds:["frahnk","croak","clack"]},seasons:{spring:{presence:"resident",commonness:"uncommon"},summer:{presence:"summer",commonness:"uncommon"},fall:{presence:"migrant",commonness:"uncommon"},winter:{presence:"winter",commonness:"uncommon"}},range:"north_america",captureStats:{difficulty:5,speed:1,flightiness:6,camouflage:6,sizeScore:10,movementPattern:"stalking",flightPattern:"soaring",behaviorNotes:"Stands motionless in shallow water for minutes — sometimes hours — before a lightning-fast strike. In binoculars view, barely moves; the challenge is its distance from shore and its wariness. Will take long, low flight away if alarmed. Reward for patience: one of the most spectacular birds on the continent."},rarity:"uncommon",rarityColor:"#2196f3",points:280,verificationThreshold:.85,verificationMethods:2,description:'Standing four feet tall with a six-foot wingspan, the Great Blue Heron is a living dinosaur. They are consummate hunters — that statue-still pose in the shallows is pure predatory patience, followed by a strike too fast to see. They eat fish, frogs, voles, small birds, even snakes. Colonial nesters called "heronries" can host hundreds of pairs, their giant stick nests filling the tops of tall trees like a fairy-tale forest.',funFacts:[`A heron's neck can strike with such speed and force that biologists call it a "biological spear gun." The S-curve of the neck stores elastic energy like a spring, releasing it in a strike faster than the eye can follow.`,"Great Blue Herons often hunt by standing completely motionless for minutes at a time, then striking in less than a second — patience refined to an evolutionary art."],eBirdCode:"grbher3",merlinId:"Great_Blue_Heron"},{id:"mourning_dove",commonName:"Mourning Dove",scientificName:"Zenaida macroura",family:"Columbidae",order:"Columbiformes",sizeCategory:"small",length_cm:[22,36],wingspan_cm:[37,45],weight_g:[96,170],appearance:{billShape:"thin",billSizeRelative:"small",billColor:{male:"dark gray",female:"dark gray"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#C4A882",female:"#C4A882"},uiColor:"#C4A882",distinctiveMarkings:{male:["Soft buffy-brown overall","Small black spot below ear","Long pointed tail with white edges","Rosy-pink wash on breast","Iridescent neck patch"],female:["Nearly identical to male, slightly duller"],juvenile:["Scaly-looking, spotted below"]},plumageDescription:{male:"Soft warm brown above, pale below with a gentle rosy-pink wash. A small black spot sits below and behind the eye. The neck has a subtle iridescent green-and-pink sheen. The long, pointed tail fans out in flight to reveal white-tipped outer feathers.",female:"Nearly identical to male but slightly duller, with less iridescence on the neck.",juvenile:"Scaly appearance due to pale feather edges; spotted breast."}},primaryHabitat:["open_fields","gardens","farmland","woodland_edge","roadsides"],feedingLayer:"ground",flightStyle:"direct",socialBehavior:{breeding:"monogamous_pairs",winter:"flocks"},typicalGroupSize:{min:1,max:20},activeHours:"diurnal",sound:{callDescription:'The familiar "coo-OO-oo-oo-oo" — a soft, mournful five-note call that gives the species its name.',songDescription:'Repeated soft cooing, slightly descending: "cooOOoo-oo-oo".',loudness:4,callFrequency:8,singingSeason:{spring:"frequent",summer:"frequent",fall:"occasional",winter:"occasional"}},seasons:{spring:{presence:"resident",commonness:"very_common"},summer:{presence:"resident",commonness:"very_common"},fall:{presence:"resident",commonness:"common"},winter:{presence:"resident",commonness:"common"}},captureStats:{difficulty:2,speed:3,flightiness:3,camouflage:4,sizeScore:4,movementPattern:"walking",flightPattern:"direct",behaviorNotes:"Walks slowly on ground picking up seeds. Flushes with a whistling wing noise when startled. Often perches on wires."},rarity:"common",rarityColor:"#4caf50",points:80,verificationThreshold:.6,verificationMethods:1,description:"One of North America's most abundant birds, the Mourning Dove is a year-round fixture from suburban yards to open farmland. Its mournful cooing is one of the most recognizable sounds in the American soundscape. Despite its gentle look, it is a prolific breeder — pairs can raise up to six broods per year. It swallows seeds whole and stores them in its crop, returning to a perch to digest.",funFacts:["Mourning Doves can drink by sucking water like a straw, without lifting their heads — a trick shared by very few birds.",`A Mourning Dove's crop produces "crop milk" — a protein-rich secretion fed to nestlings that is chemically similar to mammal milk, made by both parents.`],eBirdCode:"moudov",merlinId:"Mourning_Dove"},{id:"american_crow",commonName:"American Crow",scientificName:"Corvus brachyrhynchos",family:"Corvidae",order:"Passeriformes",sizeCategory:"medium",length_cm:[40,53],wingspan_cm:[85,100],weight_g:[316,620],appearance:{billShape:"hooked",billSizeRelative:"large",billColor:{male:"black",female:"black"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#1A1A1A",female:"#1A1A1A"},uiColor:"#4A4A5A",distinctiveMarkings:{male:["All black with glossy blue-violet iridescence","Fan-shaped tail","Heavy bill",'Loud "caw caw" call'],female:["Identical to male"],juvenile:["Duller black, brighter blue mouth lining"]},plumageDescription:{male:"Entirely black with a blue-violet gloss in good light. Heavy rounded bill, fan-shaped tail (distinguish from Fish Crow and Common Raven). Legs and feet black.",female:"Identical to male.",juvenile:"Dull black without gloss; gape (corner of bill) bright blue, fading by first winter."}},primaryHabitat:["woodland_edge","farmland","urban","parks","roadsides"],feedingLayer:"multi",flightStyle:"direct",socialBehavior:{breeding:"cooperative_family_groups",winter:"large_roosts"},typicalGroupSize:{min:2,max:500},activeHours:"diurnal",sound:{callDescription:'Loud, harsh "caw caw caw" — endlessly varied. Also rattles, clicks, and mimics other sounds.',songDescription:"No true song; communicates with a complex vocabulary of caws, rattles, and coos.",loudness:9,callFrequency:9,singingSeason:{spring:"frequent",summer:"frequent",fall:"frequent",winter:"frequent"}},seasons:{spring:{presence:"resident",commonness:"very_common"},summer:{presence:"resident",commonness:"very_common"},fall:{presence:"resident",commonness:"very_common"},winter:{presence:"resident",commonness:"very_common"}},captureStats:{difficulty:5,speed:5,flightiness:7,camouflage:1,sizeScore:7,movementPattern:"walking",flightPattern:"direct",behaviorNotes:'Highly wary and intelligent. Will often post a "lookout" crow while others feed. Approaches cautiously and flushes at significant distance.'},rarity:"common",rarityColor:"#4caf50",points:100,verificationThreshold:.65,verificationMethods:1,description:`The American Crow is one of North America's most intelligent animals, period. They use tools, recognize individual human faces, hold grudges for years, and conduct what appear to be "funerals" for dead flockmates. Winter roosts can number in the millions. Their notorious wariness — shaped by centuries of persecution — makes them challenging to approach, despite being everywhere.`,funFacts:['Crows remember and recognize individual human faces, and will "scold" a person who has previously threatened them — even training their young to do the same.',"American Crows use tools — they've been documented dropping walnuts on crosswalk lines so cars crack them, then waiting for the light to retrieve the meat safely."],eBirdCode:"amecro",merlinId:"American_Crow"},{id:"song_sparrow",commonName:"Song Sparrow",scientificName:"Melospiza melodia",family:"Passerellidae",order:"Passeriformes",sizeCategory:"small",length_cm:[11,18],wingspan_cm:[18,24],weight_g:[17,49],appearance:{billShape:"conical",billSizeRelative:"small",billColor:{male:"pinkish-gray",female:"pinkish-gray"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#8B6F50",female:"#8B6F50"},uiColor:"#9E7B58",distinctiveMarkings:{male:["Heavy brown streaking on white breast","Central breast spot","Brown-streaked crown with gray median stripe","Long rounded tail","Broad gray supercilium"],female:["Identical to male"],juvenile:["Finer streaking, buffier tones"]},plumageDescription:{male:"Brown and streaky throughout. The white breast bears bold brown streaks that converge into a central spot — the single best field mark. A broad gray eyebrow contrasts with brown streaks on the head. Pumps its long rounded tail in flight.",female:"Identical to male.",juvenile:"Similar but buffer, with finer, less defined streaking."}},primaryHabitat:["shrubs","wetland_edge","gardens","thickets","woodland_edge"],feedingLayer:"ground",flightStyle:"bounding",socialBehavior:{breeding:"territorial_pairs",winter:"loose_flocks"},typicalGroupSize:{min:1,max:6},activeHours:"diurnal",sound:{callDescription:'Sharp "chimp" or "tchep" contact call.',songDescription:"Opens with 2–3 pure notes then a buzzy trill, then a varied mix of trills and notes. Each male has a repertoire of ~20 distinct song types.",loudness:6,callFrequency:7,singingSeason:{spring:"frequent",summer:"frequent",fall:"moderate",winter:"occasional"}},seasons:{spring:{presence:"resident",commonness:"common"},summer:{presence:"resident",commonness:"common"},fall:{presence:"resident",commonness:"common"},winter:{presence:"resident",commonness:"common"}},captureStats:{difficulty:4,speed:4,flightiness:5,camouflage:6,sizeScore:2,movementPattern:"hopping",flightPattern:"bounding",behaviorNotes:"Skulks low in dense shrubs. Often pumps tail while perched. Will dart back into cover quickly if alarmed."},rarity:"common",rarityColor:"#4caf50",points:90,verificationThreshold:.65,verificationMethods:1,description:"The Song Sparrow's voice fills wetland edges and shrubby yards across the continent. It is one of the most extensively studied birds in North America — researchers have tracked individual birds' song dialects, territorial behavior, and evolution for decades. Despite its plain brown looks, the complexity of its song is extraordinary: a male sings dozens of distinct song types and improvises combinations constantly.",funFacts:["Song Sparrows have regional dialects — birds in different areas sing noticeably different versions of the song, similar to regional accents in human speech.",'A male Song Sparrow learns his song partly from his father and partly from neighboring males — he then "crystallizes" his personal version early in his first spring and sings it for life.'],eBirdCode:"sonspa",merlinId:"Song_Sparrow"},{id:"downy_woodpecker",commonName:"Downy Woodpecker",scientificName:"Dryobates pubescens",family:"Picidae",order:"Piciformes",sizeCategory:"small",length_cm:[14,18],wingspan_cm:[25,31],weight_g:[20,33],appearance:{billShape:"spear",billSizeRelative:"small",billColor:{male:"gray",female:"gray"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#FAFAFA",female:"#FAFAFA"},uiColor:"#CC2222",distinctiveMarkings:{male:["Black and white checkered pattern","Bold white back stripe","Red spot on back of head","Small stubby bill"],female:["Identical but no red head spot"],juvenile:["Red cap (both sexes), loses to adult pattern by fall"]},plumageDescription:{male:"Boldly patterned in black and white. A broad white stripe runs down the center of the back. The head has bold black-and-white stripes, and males show a small red patch on the nape. Tiny bill — notably shorter than the Hairy Woodpecker, its near-identical larger cousin.",female:"Same pattern as male but lacks the red nape patch.",juvenile:"Both sexes have a red cap in juvenile plumage."}},primaryHabitat:["woodland","woodland_edge","gardens","orchards","parks"],feedingLayer:"canopy",flightStyle:"undulating",socialBehavior:{breeding:"territorial_pairs",winter:"solitary_or_mixed_flocks"},typicalGroupSize:{min:1,max:2},activeHours:"diurnal",sound:{callDescription:'Sharp "pik!" — higher and softer than Hairy Woodpecker.',songDescription:"Rapid whinny descending in pitch. Also drums on resonant wood.",loudness:5,callFrequency:6,singingSeason:{spring:"frequent",summer:"moderate",fall:"occasional",winter:"occasional"}},seasons:{spring:{presence:"resident",commonness:"common"},summer:{presence:"resident",commonness:"common"},fall:{p d. The white tail flashes are conspicuous in flight."},rarity:"common",rarityColor:"#4caf50",points:90,verificationThreshold:.65,verificationMethods:1,description:`The Dark-eyed Junco is nicknamed "snowbird" — its arrival at feeders signals the start of winter. They breed in boreal forests and mountainsides, then flood south and downslope to spend winter in suburban yards. Flocks scratch methodically through leaf litter and beneath feeders, and the flash of white outer tail feathers as they flush is one of winter birding's most familiar sights.`,funFacts:['The Dark-eyed Junco is actually not one species but a "superspecies" — the Slate-colored, Oregon, Pink-sided, Gray-headed, and White-winged forms were once considered separate species and still look strikingly different.','Dark-eyed Juncos breed in the mountains and boreal north, but winter at lower elevations and latitudes — so many birders see them only in winter, earning the nickname "snowbirds."'],eBirdCode:"daejun",merlinId:"Dark-eyed_Junco"},{id:"house_finch",commonName:"House Finch",scientificName:"Haemorhous mexicanus",family:"Fringillidae",order:"Passeriformes",sizeCategory:"small",length_cm:[13,14],wingspan_cm:[20,25],weight_g:[16,27],appearance:{billShape:"conical",billSizeRelative:"medium",billColor:{male:"gray",female:"gray"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#CC4422",female:"#8B7355"},uiColor:"#CC4422",distinctiveMarkings:{male:["Rosy-red head, breast, and rump","Brown-streaked back and flanks","Curved culmen (curved upper bill edge)"],female:["Plain brown with heavy streaking, no red","Blurry face pattern without sharp supercilium"],juvenile:["Similar to female"]},plumageDescription:{male:"The rosy-red of the head and breast varies enormously — birds eating more carotenoid-rich food are brighter red, yellow-orange birds ate less. The curved bill and streaked flanks distinguish males from Purple Finches.",female:"Plain brown and heavily streaked, with an indistinct face pattern. Identified by the curved bill and stocky shape.",juvenile:"Similar to female."}},primaryHabitat:["urban","suburban","gardens","farmland","woodland_edge"],feedingLayer:"shrub",flightStyle:"undulating",socialBehavior:{breeding:"loosely_colonial",winter:"large_flocks"},typicalGroupSize:{min:2,max:50},activeHours:"diurnal",sound:{callDescription:'A rising "weet?" call.',songDescription:'Long, rambling, cheerful warble ending in a buzzy "zree." Males sing constantly from exposed perches.',loudness:6,callFrequency:7,singingSeason:{spring:"frequent",summer:"frequent",fall:"moderate",winter:"moderate"}},seasons:{spring:{presence:"resident",commonness:"very_common"},summer:{presence:"resident",commonness:"very_common"},fall:{presence:"resident",commonness:"common"},winter:{presence:"resident",commonness:"common"}},captureStats:{difficulty:3,speed:4,flightiness:4,camouflage:3,sizeScore:2,movementPattern:"perching",flightPattern:"undulating",behaviorNotes:"Active feeder visitor, comfortable near humans. Males sing persistently from prominent perches."},rarity:"common",rarityColor:"#4caf50",points:90,verificationThreshold:.65,verificationMethods:1,description:"Originally native to the western US, the House Finch was released in New York in the 1940s after a failed pet-trade scheme. The eastern population exploded and the two populations reconnected across the continent. Today it is one of the most abundant birds in North America and a fixture at feeders. Males famously vary in color from pale yellow to deep red depending on their diet during molt.",funFacts:["The redness of a male House Finch's plumage depends entirely on diet — birds with access to red berries and fruits become brilliantly red, while those eating less colorful food turn yellow-orange.",'House Finches were originally a western bird; a group was illegally sold as "Hollywood Finches" in New York in the 1940s, released when the law closed in, and are now established across the entire eastern US.'], ings and cafes. Forages in noisy flocks."},rarity:"common",rarityColor:"#4caf50",points:-10,introduced:!0,invasiveNote:"Introduced to New York City in 1851, the House Sparrow now numbers over 500 million worldwide. It aggressively evicts native cavity-nesting birds — bluebirds, Tree Swallows, Carolina Wrens — from nest boxes and natural cavities. Releasing it back into the wild rather than logging it in your aviary is the right call.",verificationThreshold:.55,verificationMethods:1,description:"Introduced to New York in 1851, the House Sparrow has colonized every corner of North America where humans live. It's among the world's most abundant birds. Though often overlooked, its success is a study in adaptability — it has evolved measurably in the 170 years since introduction, with different US populations already diverging in body size and bill shape in response to local climates.",funFacts:["Male House Sparrows with larger black bibs are dominant and get first access to food and mates — female sparrows prefer males with bigger bibs.","House Sparrows were introduced to Brooklyn, NY in 1851 from England and have spread to every corner of North America — one of the most successful (and controversial) introductions in history."],eBirdCode:"houspa",merlinId:"House_Sparrow"},{id:"european_starling",commonName:"European Starling",scientificName:"Sturnus vulgaris",family:"Sturnidae",order:"Passeriformes",sizeCategory:"small",length_cm:[19,22],wingspan_cm:[31,44],weight_g:[58,101],appearance:{billShape:"spear",billSizeRelative:"medium",billColor:{male:"yellow (breeding)",female:"yellow (breeding)"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#2A2A2A",female:"#2A2A2A"},uiColor:"#556B55",distinctiveMarkings:{male:["Iridescent green-purple gloss in breeding plumage","Spotted in winter (spots wear off by spring)","Short tail, triangular wing shape","Yellow bill in spring"],female:["Similar to male; bill base pink in female vs. blue in male"],juvenile:["Plain gray-brown, transitioning to adult spottedness"]},plumageDescription:{male:'In summer a glossy, oil-slick mix of iridescent green and purple. In winter the feather tips show white spots that gradually wear away by spring. The short tail and triangular wing shape make it look like a "flying arrowhead" in flight.',female:"Nearly identical to male; distinguished by the pinkish-tan base to the lower mandible (blue in males).",juvenile:"Uniformly grayish-brown, molting into spotted adult plumage through the first winter."}},primaryHabitat:["urban","farmland","parks","woodland_edge"],feedingLayer:"ground",flightStyle:"direct",socialBehavior:{breeding:"loosely_colonial",winter:"massive_flocks"},typicalGroupSize:{min:1,max:1e5},activeHours:"diurnal",sound:{callDescription:"Raspy, varied — whistles, rattles, clicks, and an extraordinary range of mimicry.",songDescription:"A rambling medley of whistles and rattles, often including perfect mimicry of other birds' calls.",loudness:7,callFrequency:8,singingSeason:{spring:"frequent",summer:"moderate",fall:"moderate",winter:"moderate"}},seasons:{spring:{presence:"resident",commonness:"very_common"},summer:{presence:"resident",commonness:"very_common"},fall:{presence:"resident",commonness:"very_common"},winter:{presence:"resident",commonness:"very_common"}},captureStats:{difficulty:3,speed:5,flightiness:4,camouflage:3,sizeScore:4,movementPattern:"walking",captureBackground:"urban_edge",flightPattern:"direct",behaviorNotes:"Walks briskly with head-bobbing gait. Often in large noisy flocks. Winter murmurations are spectacular."},rarity:"common",rarityColor:"#4caf50",points:-15,introduced:!0,invasiveNote:"Released in Central Park in 1890 by Eugene Schieffelin, who wanted to introduce every bird mentioned by Shakespeare. The result: 200 million starlings across North America. Starlings evict woodpeckers, Purple Martins, and bluebirds from nest cavities — sometimes killing the occupants. Spectacular murmurations cannot undo the ecological damage.",verificationThreshold:.6,verificationMethods:1,description:"Introduced from Europe in the 1890s when Shakespeare enthusiasts released 60 birds in Central Park, the European Starling has become one of North America's most abundant birds with over 200 million individuals. Their winter murmurations — swirling flocks of thousands moving in perfect synchrony — are among the most spectacular wildlife sights on earth.",funFacts:["A murmuration of starlings can contain a million birds and move as a single fluid organism. Each bird tracks its seven nearest neighbors, and the information wave travels through the flock faster than any individual can process.","European Starlings were introduced to Central Park in 1890 by a Shakespeare enthusiast who wanted to establish every bird mentioned in Shakespeare's works in North America. Today there are over 200 million in North America."],eBirdCode:"eursta",merlinId:"European_Starling"},{id:"red_winged_blackbird",commonName:"Red-winged Blackbird",scientificName:"Agelaius phoeniceus",family:"Icteridae",order:"Passeriformes",sizeCategory:"small",length_cm:[17,23],wingspan_cm:[31,40],weight_g:[32,77],appearance:{billShape:"spear",billSizeRelative:"medium",billColor:{male:"black",female:"brown"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#1A1A1A",female:"#5A4030"},uiColor:"#CC3311",distinctiveMarkings:{male:["All black with brilliant red-and-yellow epaulets","Epaulets hidden when at rest, flashed during display"],female:["Heavily streaked brown — looks like a large sparrow","Slightly rusty eyebrow"],juvenile:["Similar to female"]},plumageDescription:{male:"Jet black with unmistakable red-and-yellow shoulder patches (epaulets). Males can conceal or display the red patch — a concealed bird looks plain black, a displaying male blazes.",female:"Heavily streaked brown with a hint of rusty tones — so different from males that they were once described as a separate species.",juvenile:"Similar to female."}},primaryHabitat:["wetlands","marshes","meadows","farmland","roadside"],feedingLayer:"ground",flightStyle:"direct",socialBehavior:{breeding:"polygynous_territories",winter:"huge_flocks"},typicalGroupSize:{min:1,max:1e3},activeHours:"diurnal",sound:{callDescription:'Loud "chek" or "tseee" alarm.',songDescription:'The iconic "conk-a-ree!" — a liquid gurgling trill, usually from a cattail perch.',loudness:8,callFrequency:8,singingSeason:{spring:"frequent",summer:"frequent",fall:"occasional",winter:"rare"}},seasons:{spring:{presence:"resident",commonness:"very_common"},summer:{presence:"resident",commonness:"very_common"},fall:{presence:"migrant",commonness:"common"},winter:{presence:"partial_migrant",commonness:"uncommon"}},captureStats:{difficulty:3,speed:5,flightiness:5,camouflage:2,sizeScore:4,movementPattern:"perching",flightPattern:"direct",behaviorNotes:"Males perch conspicuously on cattails and sing constantly. Aggressively defends territory against much larger intruders including hawks."},rarity:"common",rarityColor:"#4caf50",points:100,verificationThreshold:.65,verificationMethods:1,description:`The Red-winged Blackbird may be the most numerous bird in North America — population estimates approach 250 million. The male's "conk-a-ree" from a cattail perch is the defining sound of spring wetlands. Males are fiercely territorial and regularly dive-bomb hawks, crows, and humans who approach nests.`,funFacts:["A male Red-winged Blackbird may have up to 15 females nesting in his territory simultaneously — one of the most polygynous birds in North America.","Red-winged Blackbirds are one of the most numerous birds in North America, with an estimated 130–190 million individuals — yet their population has declined significantly due to agricultural changes."],eBirdCode:"rewbla",merlinId:"Red-winged_Blackbird"},{id:"canada_goose",commonName:"Canada Goose",scientificName:"Branta canadensis",family:"Anatidae",order:"Anseriformes",sizeCategory:"very_large",length_cm: erica. Once genuinely migratory, many urban populations have gone resident year-round, thriving on parks, golf courses, and manicured lawns. Mated pairs bond for life, and both parents vigorously defend chicks — triggering many a suburban standoff.",funFacts:["Geese fly in V-formation because each bird's wingtip vortex creates an uplift for the bird behind. The lead goose works hardest — so the formation rotates leadership to share the effort.","Canada Geese mate for life and grieve visibly when a partner dies — remaining near the body and sometimes not joining the flock migration for weeks afterward."],eBirdCode:"cangoo",merlinId:"Canada_Goose"},{id:"osprey",commonName:"Osprey",scientificName:"Pandion haliaetus",family:"Pandionidae",order:"Accipitriformes",sizeCategory:"large",length_cm:[52,60],wingspan_cm:[150,180],weight_g:[1200,2050],appearance:{billShape:"hooked",billSizeRelative:"large",billColor:{male:"blue-gray/black",female:"blue-gray/black"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#3A3020",female:"#3A3020"},uiColor:"#5A8080",distinctiveMarkings:{male:["Dark brown above, white below","White head with bold dark eye stripe","Distinctive wrist patches (dark carpal patches) in flight",'Bowed wings in flight ("M" shape)'],female:["Brown necklace across upper breast"],juvenile:["Pale edges on back feathers give scaled appearance"]},plumageDescription:{male:"Dark chocolate-brown above and bright white below. The white head sports a bold dark stripe through the eye. In flight the long, bowed wings with dark carpal patches are unmistakable — no other raptor looks quite like it.",female:"Nearly identical to male but typically shows a brown necklace across the breast.",juvenile:"Similar to adult but back feathers edged with pale buff, giving a scaled look."}},primaryHabitat:["coastlines","rivers","lakes","estuaries","reservoirs"],feedingLayer:"aerial",flightStyle:"soaring",socialBehavior:{breeding:"monogamous_pairs",winter:"solitary"},typicalGroupSize:{min:1,max:2},activeHours:"diurnal",sound:{callDescription:'High, whistled "cheep-cheep-cheep" or "kyew kyew kyew" — surprisingly small-sounding for such a large bird.',songDescription:"No song; communicates with high whistled calls.",loudness:6,callFrequency:4,singingSeason:{spring:"moderate",summer:"moderate",fall:"occasional",winter:"rare"}},seasons:{spring:{presence:"migrant_and_breeder",commonness:"uncommon"},summer:{presence:"breeder",commonness:"uncommon"},fall:{presence:"migrant",commonness:"uncommon"},winter:{presence:"absent_most_of_US",commonness:"rare"}},captureStats:{difficulty:7,speed:7,flightiness:6,camouflage:2,sizeScore:8,movementPattern:"soaring",flightPattern:"soaring",behaviorNotes:"Hunts by hovering over water then plunge-diving feet-first. Perches conspicuously on dead snags near water. Usually detected by call."},rarity:"uncommon",rarityColor:"#2196f3",points:200,verificationThreshold:.75,verificationMethods:1,description:"The Osprey is a specialist fish hunter found on every continent except Antarctica. It is one of the great conservation success stories — DDT nearly wiped it out, but after the ban it has fully recovered across North America. Watching an Osprey stall in a hover, then fold its wings and plunge 30 feet into water feet-first to seize a fish is one of nature's great spectacles.",funFacts:["Ospreys have reversible outer toes and barbed pads on the feet specifically to grip slippery fish — and they always rotate their catch to face forward in flight for aerodynamics.","Ospreys dive feet-first and can submerge completely to catch fish — then use their dense, oiled plumage to shake off water like a dog before flying away."],eBirdCode:"osprey",merlinId:"Osprey"},{id:"eastern_bluebird",commonName:"Eastern Bluebird",scientificName:"Sialia sialis",family:"Turdidae",order:"Passeriformes",sizeCategory:"small",length_cm:[16,21],wingspan_cm:[25,32],weight_g:[27,34],appearance:{billShape:"thin",billSizeRelative:"small",billColo ern US. It nearly vanished in the 20th century as competition with introduced House Sparrows and European Starlings for nest cavities sent populations plummeting. A massive citizen-science effort to install nest boxes reversed the decline — millions of boxes now line trails, roadsides, and farmland, and the species has fully recovered.",funFacts:["The Eastern Bluebird's color isn't from pigment — the feathers contain no blue dye. The blue is produced by the microscopic structure of the feather barbs scattering light, similar to how the sky is blue.",'Eastern Bluebird populations crashed in the mid-20th century due to competition from introduced starlings and sparrows for nest cavities — the "Bluebird Trail" movement, placing nest boxes along rural roads, helped bring them back.'],eBirdCode:"easblu",merlinId:"Eastern_Bluebird"},{id:"ruby_throated_hummingbird",commonName:"Ruby-throated Hummingbird",scientificName:"Archilochus colubris",family:"Trochilidae",order:"Apodiformes",sizeCategory:"tiny",length_cm:[7,9],wingspan_cm:[8,11],weight_g:[2,6],appearance:{billShape:"thin",billSizeRelative:"massive",billColor:{male:"black",female:"black"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#2A5A20",female:"#2A5A20"},uiColor:"#CC1122",distinctiveMarkings:{male:["Iridescent green upperparts","Brilliant ruby-red gorget (throat)","White chest and belly","Forked tail","Hovers at flowers"],female:["Green above, white below","No red throat","Rounded tail with white tips"],juvenile:["Similar to female"]},plumageDescription:{male:"Glittering emerald-green above. The throat gorget blazes ruby-red in good light but looks black at the wrong angle. White chest and belly, notched tail.",female:"Green above, white below with faint streaking on throat. White-tipped outer tail feathers.",juvenile:"Resembles female."}},primaryHabitat:["gardens","woodland_edge","orchards","meadows"],feedingLayer:"aerial",flightStyle:"hovering",socialBehavior:{breeding:"solitary_males",winter:"solitary"},typicalGroupSize:{min:1,max:1},activeHours:"diurnal",sound:{callDescription:'Soft "tseep" or "chewp." Wing beats produce an audible hum.',songDescription:"Series of rapid chipping notes; no true song.",loudness:2,callFrequency:4,singingSeason:{spring:"moderate",summer:"moderate",fall:"rare",winter:"absent"}},seasons:{spring:{presence:"migrant_and_breeder",commonness:"uncommon"},summer:{presence:"breeder",commonness:"uncommon"},fall:{presence:"migrant",commonness:"uncommon"},winter:{presence:"absent",commonness:"absent"}},captureStats:{difficulty:9,speed:10,flightiness:8,camouflage:2,sizeScore:1,movementPattern:"hovering",flightPattern:"hovering",behaviorNotes:"Extremely fast — can fly backwards, sideways, and hover perfectly. Defends feeders and flower patches aggressively. Blink and you miss it."},rarity:"uncommon",rarityColor:"#2196f3",points:250,verificationThreshold:.8,verificationMethods:1,description:"The only hummingbird that breeds in the eastern US, the Ruby-throated is a marvel of miniaturized engineering. Its heart beats over 1,200 times per minute in flight. It crosses the Gulf of Mexico non-stop — 800 miles over open water — twice a year on migration, fueled by fat reserves that double its body weight before departure. A single nest, the size of half a walnut, is made of plant fibers bound with spider silk.",funFacts:["A Ruby-throated Hummingbird in migration can double its body weight in fat reserves — then burn it all off crossing the Gulf of Mexico in an 18-20 hour non-stop flight.","A hummingbird's heart beats up to 1,260 times per minute in flight — and they enter torpor at night, lowering their body temperature by 50°F to save energy while sleeping."],eBirdCode:"rthhum",merlinId:"Ruby-throated_Hummingbird"},{id:"cedar_waxwing",commonName:"Cedar Waxwing",scientificName:"Bombycilla cedrorum",family:"Bombycillidae",order:"Passeriformes",sizeCategory:"small",length_cm:[14,17],wingspan_cm:[22,30],weight_g:[30,40],appearance:{billShape:"thin",billSizeRelative:"small",billColor:{male:"black",female:"black"},crestPresent:!0,crestColor:{male:"brown",female:"brown"},primaryColor:{male:"#9B7B55",female:"#9B7B55"},uiColor:"#CC8822",distinctiveMarkings:{male:["Silky warm-brown body","Sleek crest","Black mask","Yellow tail tip","Red waxy wing tips","Lemon-yellow belly"],female:["Nearly identical to male"],juvenile:["Streaky, lacks wax tips; face mask faint"]},plumageDescription:{male:"One of the most elegantly-groomed birds in North America. Silky warm-brown with a sleek crest, black mask, lemon-yellow belly, yellow tail tip, and the namesake red waxy droplets on wing feather tips.",female:"Nearly identical to male; slightly less red wax, slighter mask.",juvenile:"Streaky brown, lacks wax tips until first winter."}},primaryHabitat:["woodland","orchards","gardens","fruiting_trees","streamsides"],feedingLayer:"canopy",flightStyle:"undulating",socialBehavior:{breeding:"loose_colonies",winter:"nomadic_flocks"},typicalGroupSize:{min:5,max:200},activeHours:"diurnal",sound:{callDescription:'High, thin "seee" — a pure high-pitched whistle, often the first sign of a passing flock overhead.',songDescription:'High trilled "sreeee"; thin whistle notes.',loudness:4,callFrequency:8,singingSeason:{spring:"frequent",summer:"frequent",fall:"moderate",winter:"moderate"}},seasons:{spring:{presence:"resident",commonness:"uncommon"},summer:{presence:"resident",commonness:"uncommon"},fall:{presence:"nomadic",commonness:"common"},winter:{presence:"nomadic",commonness:"common"}},captureStats:{difficulty:6,speed:6,flightiness:6,camouflage:3,sizeScore:3,movementPattern:"perching",flightPattern:"undulating",behaviorNotes:"Appears suddenly in fruiting trees, strips them, and moves on. Listen for the high seee calls overhead. Flocks are compact and coordinated."},rarity:"uncommon",rarityColor:"#2196f3",points:200,verificationThreshold:.75,verificationMethods:1,description:"Cedar Waxwings are wandering nomads, following fruit crops across the continent rather than fixed territories. They are famous for their elegant appearance and for passing berries beak-to-beak down a perched line of birds — a social display of fruit-sharing. They have been observed getting drunk on fermented berries, stumbling around until they sober up.",funFacts:["Cedar Waxwings sometimes pass berries beak-to-beak down a row of perched birds — apparently a courtship or social bonding behavior. They also get intoxicated on fermented fruits and have been found unable to fly.","The red waxy tips on Cedar Waxwing wing feathers are actually extensions of the feather shafts — like tiny red beads — and older birds have more of them, making age visible at a glance."],eBirdCode:"cedwax",merlinId:"Cedar_Waxwing"},{id:"turkey_vulture",commonName:"Turkey Vulture",scientificName:"Cathartes aura",family:"Cathartidae",order:"Cathartiformes",sizeCategory:"very_large",length_cm:[62,81],wingspan_cm:[160,183],weight_g:[854,2260],appearance:{billShape:"hooked",billSizeRelative:"large",billColor:{male:"ivory-white",female:"ivory-white"},crestPresent:!1,crestColor:{male:null,female:null},primaryColor:{male:"#2A1A10",female:"#2A1A10"},uiColor:"#CC3311",distinctiveMarkings:{male:["All dark body","Naked red head (adult)","Silvery wing lining from below",'Soars in a "V" (dihedral) with much teetering'],female:["Identical to male"],juvenile:["Gray head instead of red"]},plumageDescription:{male:"All dark brown-black body. The naked red head is the key adult field mark — a featherless head helps when feeding inside carcasses. From below, the flight feathers are silvery, contrasting with darker wing linings.",female:"Identical to male.",juvenile:"Gray-headed; bill dark-tipped."}},primaryHabitat:["open_country","roadsides","farmland","forest_edge","thermals"],feedingLayer:"aerial",flightStyle:"soaring",socialBehavior:{breeding:"loose_colonies",winter:"large_roosts"},typicalGroupSize:{min:1,max:50},activeHours:"diurnal",sound:{callDescription:"Essentially silent — only produces hisses and grunts. No vocal organ.",songDescription:"No song; lacks a syrinx (voice organ).",loudness:1,callFrequency:1,singingSeason:{spring:"rare",summer:"rare",fall:"rare",winter:"rare"}},seasons:{spring:{presence:"migrant_and_breeder",commonness:"common"},summer:{presence:"breeder",commonness:"common"},fall:{presence:"migrant",commonness:"common"},winter:{presence:"partial_migrant",commonness:"uncommon"}},captureStats:{difficulty:5,speed:6,flightiness:5,camouflage:2,sizeScore:9,movementPattern:"soaring",flightPattern:"soaring",behaviorNotes:'Soars in wide circles on thermals, rocking side to side in a "V." Locate by scanning the sky rather than the ground.'},rarity:"common",rarityColor:"#4caf50",points:130,verificationThreshold:.7,verificationMethods:1,description:"The Turkey Vulture is nature's sanitation crew, and arguably one of the most important birds in the ecosystem. It locates carrion primarily by smell — extraordinarily rare among birds — using one of the most highly developed olfactory systems in the animal kingdom. Its stomach acid is powerful enough to destroy anthrax, botulism, and cholera, preventing these diseases from spreading through the environment.",funFacts:["Turkey Vultures are one of the only birds that find food primarily by smell. They have a greatly enlarged olfactory lobe in the brain and can detect a dead animal hidden under forest canopy from a mile away.",'Turkey Vultures practice "urohidrosis" — they urinate on their own legs to cool down. The evaporating liquid lowers their temperature, similar to sweating, and the uric acid may also kill bacteria from standing on carcasses.'],eBirdCode:"turvul",merlinId:"Turkey_Vulture"},{id:"common_grackle",commonName:"Common Grackle",scientificName:"Quiscalus quiscula",family:"Icteridae",order:"Passeriformes",sizeCategory:"small",length_cm:[28,34],wingspan_cm:[36,46],weight_g:[74,142],appearance:{billShape:"spear",billSizeRelative:"large",billColor:{male:"black",fema
